<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Beauty Match | Results</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html" style="font-family: 'Playfair Display', serif;">
                <i class="bi bi-stars text-primary"></i> AI Beauty Match
            </a>
            <div class="ms-auto">
                <a class="btn btn-outline-primary btn-sm rounded-pill" href="ai-match.html">
                    <i class="bi bi-arrow-left"></i> Try Another
                </a>
            </div>
        </div>
    </nav>

    <!-- Results Section -->
    <section class="py-5">
        <div class="container">
            <!-- Header -->
            <div class="row mb-5">
                <div class="col-lg-8 mx-auto text-center">
                    <h1 class="fw-bold" style="font-family: 'Playfair Display', serif;">Your Best Matches</h1>
                    <p class="text-muted" id="matchSummaryText">Based on your input, here are the closest affordable alternatives from our catalogue.</p>
                    
                    <!-- Extracted Attributes Pill box -->
                    <div class="bg-white p-3 rounded-4 shadow-sm d-inline-block mt-3 text-start" id="attributesBox" style="display: none !important;">
                        <span class="text-muted small d-block mb-2 text-center">AI Extracted Attributes</span>
                        <div id="attributesList" class="d-flex flex-wrap gap-2 justify-content-center">
                            <!-- Pills will be injected here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Results Container -->
            <div class="row justify-content-center" id="resultsContainer">
                <!-- Fallback / Loading -->
                <div class="col-12 text-center" id="loadingState">
                    <div class="spinner-border text-primary mb-3" role="status"></div>
                    <p>Processing results...</p>
                </div>
            </div>
            
            <div class="row justify-content-center mt-5 d-none" id="noResultsState">
                <div class="col-md-6 text-center">
                    <i class="bi bi-emoji-frown text-muted" style="font-size: 4rem;"></i>
                    <h3 class="mt-3">No Matches Found</h3>
                    <p class="text-muted">We couldn't find any products in our catalogue that match your criteria closely enough.</p>
                    <a href="ai-match.html" class="btn btn-primary mt-3 rounded-pill px-4">Try Again</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Template for Result Card -->
    <template id="resultCardTemplate">
        <div class="col-lg-8 mb-4">
            <div class="card product-card rounded-4 border-0 shadow-sm overflow-hidden h-100">
                <div class="row g-0">
                    <div class="col-md-4 bg-light d-flex align-items-center justify-content-center p-3">
                        <img src="" class="img-fluid rounded-3 shadow-sm product-img" alt="Product Image" style="max-height: 250px; object-fit: contain;">
                    </div>
                    <div class="col-md-8">
                        <div class="card-body p-4 d-flex flex-column h-100">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <span class="badge bg-primary-subtle text-primary rounded-pill mb-2 match-rank">BEST MATCH</span>
                                    <h4 class="card-title fw-bold mb-1 product-name">Product Name</h4>
                                    <p class="text-muted mb-0 product-brand">Brand</p>
                                </div>
                                <div class="text-end">
                                    <h3 class="text-success fw-bold mb-0 product-price">₹0</h3>
                                </div>
                            </div>
                            
                            <hr class="my-3 text-muted">
                            
                            <h6 class="fw-bold mb-3"><i class="bi bi-check-circle-fill text-success me-2"></i>Why it matches:</h6>
                            <ul class="list-unstyled mb-4 match-reasons">
                                <!-- Reasons injected here -->
                            </ul>
                            
                            <div class="mt-auto pt-3">
                                <button class="btn btn-primary w-100 rounded-pill view-btn">View Product Details</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resultsContainer = document.getElementById('resultsContainer');
            const template = document.getElementById('resultCardTemplate');
            const attributesList = document.getElementById('attributesList');
            const attributesBox = document.getElementById('attributesBox');
            const loadingState = document.getElementById('loadingState');
            const noResultsState = document.getElementById('noResultsState');

            // Retrieve data from session storage
            const attributesData = sessionStorage.getItem('ai_attributes');
            const matchData = sessionStorage.getItem('match_results');

            if (!attributesData || !matchData) {
                window.location.href = 'ai-match.html';
                return;
            }

            const attributes = JSON.parse(attributesData);
            const matches = JSON.parse(matchData);

            // Display Extracted Attributes
            let hasAttributes = false;
            const skipKeys = ['budget', 'features'];
            
            for (const [key, value] of Object.entries(attributes)) {
                if (value && !skipKeys.includes(key)) {
                    hasAttributes = true;
                    const pill = document.createElement('span');
                    pill.className = 'badge bg-secondary rounded-pill fw-normal text-capitalize';
                    pill.textContent = `${key.replace('_', ' ')}: ${value}`;
                    attributesList.appendChild(pill);
                }
            }
            if (attributes.budget) {
                hasAttributes = true;
                const pill = document.createElement('span');
                pill.className = 'badge bg-success rounded-pill fw-normal';
                pill.innerHTML = `<i class="bi bi-tag-fill me-1"></i>Under ₹${attributes.budget}`;
                attributesList.appendChild(pill);
            }

            if (hasAttributes) {
                attributesBox.style.setProperty('display', 'inline-block', 'important');
            }

            // Hide loading
            loadingState.classList.add('d-none');

            // Render Results
            if (matches.length === 0) {
                noResultsState.classList.remove('d-none');
                return;
            }

            matches.forEach((match, index) => {
                const clone = template.content.cloneNode(true);
                
                clone.querySelector('.product-img').src = match.image;
                clone.querySelector('.product-name').textContent = match.name;
                clone.querySelector('.product-brand').textContent = match.brand;
                clone.querySelector('.product-price').textContent = `₹${match.price}`;
                
                const rankBadge = clone.querySelector('.match-rank');
                if (index === 0) {
                    rankBadge.textContent = 'BEST MATCH';
                } else if (index === 1) {
                    rankBadge.textContent = 'SECOND MATCH';
                    rankBadge.className = 'badge bg-secondary bg-opacity-25 text-secondary rounded-pill mb-2 match-rank';
                } else {
                    rankBadge.textContent = 'THIRD MATCH';
                    rankBadge.className = 'badge bg-secondary bg-opacity-25 text-secondary rounded-pill mb-2 match-rank';
                }

                const reasonsList = clone.querySelector('.match-reasons');
                match.reasons.forEach(reason => {
                    const li = document.createElement('li');
                    li.className = 'mb-2';
                    li.innerHTML = `<i class="bi bi-arrow-right-short text-primary me-2"></i>${reason}`;
                    reasonsList.appendChild(li);
                });

                clone.querySelector('.view-btn').addEventListener('click', () => {
                    window.location.href = `product-details.html?id=${match.id}`;
                });

                resultsContainer.appendChild(clone);
            });
        });
    </script>
</body>
</html>
