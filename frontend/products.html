<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Beauty Match | Catalogue</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html" style="font-family: 'Playfair Display', serif;">
                <i class="bi bi-stars text-primary"></i> AI Beauty Match
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="products.html">Catalogue</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-primary px-4 rounded-pill shadow-sm" href="ai-match.html">
                            Try AI Match <i class="bi bi-magic"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Products Section -->
    <section class="py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-end mb-4">
                <div>
                    <h2 class="fw-bold mb-1" style="font-family: 'Playfair Display', serif;">Full Catalogue</h2>
                    <p class="text-muted mb-0">Browse our curated selection of affordable alternatives.</p>
                </div>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Loading products...</p>
            </div>

            <div class="row g-4" id="productsGrid">
                <!-- Products injected here -->
            </div>
        </div>
    </section>

    <!-- Template -->
    <template id="productCardTemplate">
        <div class="col-md-4 col-lg-3">
            <div class="card product-card h-100 rounded-4 shadow-sm overflow-hidden border-0">
                <div class="bg-white p-3 text-center" style="height: 250px; display: flex; align-items: center; justify-content: center;">
                    <img src="" class="img-fluid rounded product-img" alt="Product" style="max-height: 100%; object-fit: contain;">
                </div>
                <div class="card-body">
                    <p class="text-muted small text-uppercase mb-1 product-category">Category</p>
                    <h6 class="card-title fw-bold text-truncate product-name">Product Name</h6>
                    <p class="small text-muted mb-2 product-brand">Brand Name</p>
                    <h5 class="text-success fw-bold product-price">₹0</h5>
                </div>
                <div class="card-footer bg-white border-0 pt-0 pb-3">
                    <a href="#" class="btn btn-outline-primary w-100 rounded-pill product-link">View Details</a>
                </div>
            </div>
        </div>
    </template>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const productsGrid = document.getElementById('productsGrid');
            const template = document.getElementById('productCardTemplate');
            const loadingSpinner = document.getElementById('loadingSpinner');

            try {
                const products = await API.getAllProducts();
                loadingSpinner.classList.add('d-none');
                
                products.forEach(product => {
                    const clone = template.content.cloneNode(true);
                    
                    clone.querySelector('.product-img').src = product.image;
                    clone.querySelector('.product-category').textContent = product.category;
                    clone.querySelector('.product-name').textContent = product.name;
                    clone.querySelector('.product-brand').textContent = product.brand;
                    clone.querySelector('.product-price').textContent = `₹${product.price}`;
                    clone.querySelector('.product-link').href = `product-details.html?id=${product.id}`;
                    
                    productsGrid.appendChild(clone);
                });
            } catch (error) {
                loadingSpinner.innerHTML = '<p class="text-danger">Failed to load products. Ensure the backend is running.</p>';
            }
        });
    </script>
</body>
</html>
